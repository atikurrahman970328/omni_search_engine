name: omni_search_engine
description: "A cross-platform automated search engine project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # System & Device Info (Fix for V2 Embedding error)
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

  # Local Database & Storage
  sqflite: ^2.3.3+1
  shelf: ^1.4.1

  # Network & Utilities
  http: ^1.2.1
  intl: ^0.19.0
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true